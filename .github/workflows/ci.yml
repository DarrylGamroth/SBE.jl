name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      id-token: write
    env:
      SBE_VERSION: '1.37.1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
          - version: '1'
            os: ubuntu-latest
            arch: x64
          - version: 'nightly'
            os: ubuntu-latest
            arch: x64
            allow_failure: true
          - version: '1.10'
            os: windows-latest
            arch: x64
          - version: '1'
            os: windows-latest
            arch: x64
          - version: 'nightly'
            os: windows-latest
            arch: x64
            allow_failure: true
          - version: '1.10'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: 'nightly'
            os: macos-latest
            arch: aarch64
            allow_failure: true
    steps:
      - uses: actions/checkout@v4
      - name: Checkout SbeTool compatibility fixtures
        if: runner.os == 'Linux' && matrix.version == '1'
        uses: actions/checkout@v4
        with:
          repository: aeron-io/simple-binary-encoding
          ref: ${{ env.SBE_VERSION }}
          path: sbe-upstream
          sparse-checkout: sbe-tool/src/test/resources
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Cache SBE jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/sbe
          key: sbe-jar-${{ runner.os }}-${{ env.SBE_VERSION }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Generate Java fixtures (Linux)
        if: runner.os == 'Linux'
        run: julia --project=. scripts/generate_java_fixtures.jl
      - uses: julia-actions/julia-buildpkg@v1
      - name: Check SbeTool schema and IR compatibility
        if: runner.os == 'Linux' && matrix.version == '1'
        run: >-
          julia --project=. scripts/check_sbetool_schema_compat.jl
          sbe-upstream/sbe-tool/src/test/resources
          ~/.cache/sbe/sbe-all-${SBE_VERSION}.jar
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
